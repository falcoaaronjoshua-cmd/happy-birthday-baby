<!doctype html> 
 <html lang="en"> 
 <head> 
 <meta charset="utf-8" /> 
 <meta name="viewport" content="width=device-width,initial-scale=1" /> 
 <title>Happy 21st Birthday, My Baby</title> 
 
 
 <style> 
   :root { --bg: linear-gradient(135deg, #ff9a9e, #fad0c4, #a8edea, #fed6e3, #d299c2); }
 
 
   html, body { 
     height: 100%; 
     margin: 0; 
     font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; 
   } 
 
 
   body { 
     display: flex; 
     align-items: center; 
     justify-content: center; 
     background: var(--bg); 
     overflow: hidden; 
   } 
 
 
   .card {
     max-width: 900px;
     width: 94%;
     text-align: center;
     padding: 40px;
     border-radius: 18px;
     background: rgba(255,255,255,0.15);
     backdrop-filter: blur(6px);
     box-shadow: 0 8px 40px rgba(0,0,0,.15);
     animation: slideIn 1s ease-out;
   }
 
 
   h1 {
     font-size: 3rem;
     color: #fff;
     margin: 0.3rem 0;
     text-shadow: 0 4px 10px rgba(0,0,0,.2), 0 0 20px rgba(255,255,255,0.5);
   }
 
 
   p { 
     color: #fff; 
     font-size: 1.1rem; 
     margin: 0.5rem 0 1.5rem; 
   } 
 
 
   .count { 
     display: flex; 
     justify-content: center; 
     gap: 12px; 
   } 
 
 
   .count div { 
     background: rgba(255,255,255,.2); 
     padding: 14px 18px; 
     border-radius: 10px; 
     min-width: 80px; 
     color: #fff; 
   } 
 
 
   .count span {
     font-size: 1.6rem;
     font-weight: bold;
     display: block;
     animation: pulse 2s infinite;
   }
 
 
   #greeting { 
     display: none; 
   } 
 
 
   button {
     margin-top: 20px;
     padding: 10px 18px;
     border: none;
     border-radius: 10px;
     background: #fff;
     font-weight: bold;
     cursor: pointer;
     transition: transform 0.3s ease;
   }

   button:hover {
     transform: scale(1.05);
   }
 
 
   canvas { 
     position: fixed; 
     inset: 0; 
     pointer-events: none; 
   } 
 
 
   @keyframes slideIn {
     from {
       opacity: 0;
       transform: translateY(50px);
     }
     to {
       opacity: 1;
       transform: translateY(0);
     }
   }

   @keyframes pulse {
     0%, 100% {
       transform: scale(1);
     }
     50% {
       transform: scale(1.1);
     }
   }

   .fade-in {
     animation: fadeIn 2s ease-in;
   }

   .floating-elements {
     position: fixed;
     top: 0;
     left: 0;
     width: 100%;
     height: 100%;
     pointer-events: none;
     z-index: -1;
   }

   .balloon, .heart {
     position: absolute;
     font-size: 2rem;
     animation: float 6s ease-in-out infinite;
   }

   .balloon:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
   .heart:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
   .balloon:nth-child(3) { bottom: 20%; left: 20%; animation-delay: 2s; }
   .heart:nth-child(4) { bottom: 10%; right: 10%; animation-delay: 3s; }

   @keyframes fadeIn {
     from { opacity: 0; }
     to { opacity: 1; }
   }

   @keyframes float {
     0%, 100% { transform: translateY(0px); }
     50% { transform: translateY(-20px); }
   }

   @media (max-width: 520px) {
     h1 { font-size: 2rem; }
   }
 </style>
 </head> 
 
 
 <body>


 <div class="floating-elements">
   <div class="balloon">🎈</div>
   <div class="heart">💖</div>
   <div class="balloon">🎈</div>
   <div class="heart">💖</div>
 </div>

 <canvas id="confetti"></canvas>


 <div class="card">
 
 
   
   <div id="countdown"> 
     <h1>Countdown to Your 21st Birthday 🎂</h1> 
     <p>Every second brings me closer to celebrating with you, my baby.</p> 
 
 
     <div class="count"> 
       <div><span id="days">0</span>Days</div> 
       <div><span id="hours">00</span>Hours</div> 
       <div><span id="minutes">00</span>Minutes</div> 
       <div><span id="seconds">00</span>Seconds</div> 
     </div> 
   </div> 
 
 
   
   <div id="greeting">
     <h1>Happy 21st Birthday, My Baby 💖</h1>
     <p id="message"></p>
     <button id="playSound">Play Song</button>
     <p><a href="song.mp3.mp3" download>Download the Birthday Song</a></p>
 
 
 </div> 
 
 
 <audio id="birthdaySong" src="song.mp3.mp3" loop></audio>
 
 <script> 
 
 
 const NAME = "my baby"; 
 const BIRTHDAY = new Date(2026, 1, 3, 0, 0, 0); // Feb 3, 2026
 
 
 const MESSAGE = `Happy birthday, my baby. 
 I hope today makes you feel how loved and appreciated you truly are. 
 You mean so much to me, and I’m grateful for every moment we share. 
 
 
 As your birthday comes and our anniversary gets closer, 
 I wish us both strength, patience, and love. 
 I believe in us always. I really hope you would like and love this little gift that I especially made for you,
 this program took me days to finish but every second of it was not a waste because it was made for you.
 
 Happy 21st birthday, my baby. I hope that 
 this year brings you endless joy, success, and all the happiness in the world. 
 I love you so much. 💖`; 
 
 
 
 const d = id => document.getElementById(id); 
 const daysEl = d("days"); 
 const hoursEl = d("hours"); 
 const minutesEl = d("minutes"); 
 const secondsEl = d("seconds"); 
 
 
 const countdownEl = d("countdown"); 
 const greetingEl = d("greeting"); 
 const messageEl = d("message"); 
 
 
 
 function updateCountdown() { 
   const now = new Date(); 
   const diff = BIRTHDAY - now; 
 
 
   if (diff <= 0) { 
     showGreeting(); 
     clearInterval(timer); 
     return; 
   } 
 
 
   const totalSeconds = Math.floor(diff / 1000); 
 
 
   const days = Math.floor(totalSeconds / 86400); 
   const hours = Math.floor((totalSeconds % 86400) / 3600); 
   const minutes = Math.floor((totalSeconds % 3600) / 60); 
   const seconds = totalSeconds % 60; 
 
 
   daysEl.textContent = days; 
   hoursEl.textContent = String(hours).padStart(2, "0"); 
   minutesEl.textContent = String(minutes).padStart(2, "0"); 
   secondsEl.textContent = String(seconds).padStart(2, "0"); 
 } 
 
 
 
 function showGreeting() {
   countdownEl.style.display = "none";
   greetingEl.style.display = "block";
   messageEl.textContent = MESSAGE;
   messageEl.classList.add("fade-in");
   startConfetti();

   const song = document.getElementById("birthdaySong");
   song.play().catch(() => {
     // Autoplay prevented
   });
 }
 
 
 
 function startConfetti() {
   const canvas = document.getElementById("confetti");
   const ctx = canvas.getContext("2d");


   canvas.width = innerWidth;
   canvas.height = innerHeight;


   const colors = ["#ff9a9e", "#fad0c4", "#a8edea", "#fed6e3", "#d299c2", "#fff"];
   const shapes = ["circle", "square", "heart"];

   const pieces = Array.from({ length: 150 }, () => ({
     x: Math.random() * canvas.width,
     y: Math.random() * canvas.height,
     r: 5 + Math.random() * 5,
     dx: -2 + Math.random() * 4,
     dy: 2 + Math.random() * 5,
     color: colors[Math.floor(Math.random() * colors.length)],
     shape: shapes[Math.floor(Math.random() * shapes.length)]
   }));


   function draw() {
     ctx.clearRect(0, 0, canvas.width, canvas.height);
     pieces.forEach(p => {
       p.y += p.dy;
       p.x += p.dx;
       ctx.fillStyle = p.color;
       if (p.shape === "circle") {
         ctx.beginPath();
         ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
         ctx.fill();
       } else if (p.shape === "square") {
         ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
       } else if (p.shape === "heart") {
         ctx.beginPath();
         ctx.moveTo(p.x, p.y - p.r / 2);
         ctx.bezierCurveTo(p.x - p.r / 2, p.y - p.r, p.x - p.r, p.y, p.x, p.y + p.r / 2);
         ctx.bezierCurveTo(p.x + p.r, p.y, p.x + p.r / 2, p.y - p.r, p.x, p.y - p.r / 2);
         ctx.fill();
       }
       if (p.y > canvas.height) p.y = -10;
     });
     requestAnimationFrame(draw);
   }


   draw();
 }
 
 
 
 document.getElementById("playSound").onclick = () => { 
   const song = document.getElementById("birthdaySong");
   if (song.paused) {
     song.play();
     document.getElementById("playSound").textContent = "Pause Song ⏸️";
   } else {
     song.pause();
     document.getElementById("playSound").textContent = "Play Song 🎵";
   }
   
 }; 
 
 
   
 updateCountdown(); 
 const timer = setInterval(updateCountdown, 1000); 
 </script> 
 
 
 </body> 
 </html>
